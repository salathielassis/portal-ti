# Cópia fiel de /etc/nginx/sites-enabled/portal-ti (VM 10.0.0.8) — snapshot 2026-09-10
# Instalar: colocar em /etc/nginx/sites-available/portal-ti e ligar em sites-enabled/.

server {
    listen 80 default_server;
    server_name portalti.doisa.com 10.0.0.8 _;

    # 35m: acima do limite de 30MB do Multer em delivery-import.module.ts
    # (PDFs escaneados da guia de entrega são maiores que o extrato de texto).
    client_max_body_size 35m;

    location /api/ {
        proxy_pass http://localhost:3333/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR da guia de entrega (delivery-import) roda várias passadas de
        # Tesseract por página e pode levar mais que os 60s default do nginx
        # — sem isso, o nginx corta a conexão no meio e o preview falha por
        # timeout mesmo com o backend ainda processando.
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
