# Cópia fiel de /etc/nginx/sites-enabled/portal-ti (VM 10.0.0.8) — snapshot 2026-09-10
# Instalar: colocar em /etc/nginx/sites-available/portal-ti e ligar em sites-enabled/.

server {
    listen 80 default_server;
    server_name portalti.doisa.com 10.0.0.8 _;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://localhost:3333/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
