# Sobe apenas o PostgreSQL local para desenvolvimento.
# Backend e frontend continuam rodando direto com `npm run` (fora de container),
# o que deixa hot-reload mais rápido durante o desenvolvimento.
#
# Uso: docker compose up -d
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: itam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itam_user
      POSTGRES_PASSWORD: itam_pass
      POSTGRES_DB: itam_db
    ports:
      - '5432:5432'
    volumes:
      - itam_pgdata:/var/lib/postgresql/data

volumes:
  itam_pgdata:
